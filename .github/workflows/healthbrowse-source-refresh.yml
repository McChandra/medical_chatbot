name: HealthBrowse source review
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: healthbrowse-medline-refresh
  cancel-in-progress: false
jobs:
  propose:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Prepare and verify candidate snapshot
        working-directory: healthbrowse
        run: |
          set -euo pipefail
          python3 scripts/maintenance_tests.py
          python3 scripts/maintenance_refresh.py
          node --test tests/medline.test.mjs tests/seven-sections.test.mjs
      - name: Open a review request when upstream changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          manifest=healthbrowse/docs/source-provenance.json
          git add healthbrowse/dist/medline-topics.json "$manifest"
          if git diff --cached --quiet; then
            echo "Publisher snapshot is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          day=$(jq -er .feed_date "$manifest")
          digest=$(jq -er .archive_sha256 "$manifest")
          branch="refresh/medline-${day}-${digest:0:12}"
          existing_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$branch" --state all --json number --jq '.[0].number // empty')
          if [[ -n "$existing_pr" ]]; then
            echo "Proposal already recorded in PR #$existing_pr." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh auth setup-git
          if ! git ls-remote --exit-code --heads origin "refs/heads/$branch"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch -c "$branch"
            git commit -m "Propose MedlinePlus snapshot for $day"
            git push origin "HEAD:refs/heads/$branch"
          else
            # Recover a previous run interrupted after push. Never overwrite existing branches.
            git fetch --no-tags origin "refs/heads/$branch"
            git diff --cached --exit-code FETCH_HEAD -- "$manifest" healthbrowse/dist/medline-topics.json
          fi
          body="$RUNNER_TEMP/healthbrowse-source-review.md"
          cat > "$body" <<'REVIEW'
          ## Publisher update
          The accompanying provenance manifest records the retrieval date, publisher archive, hashes and topic URLs added, updated or removed.

          - [ ] Source steward compared the permitted-use policy, attribution and extraction scope.
          - [ ] Clinical reviewer inspected changed excerpts against the original sources, including qualifiers and red flags.
          - [ ] Maintainer reviewed coverage tests and confirmed the previous release can be restored.
          - [ ] Review decisions and outstanding gaps are recorded on this pull request.
          REVIEW
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$branch" --title "Review MedlinePlus feed $day" --body-file "$body"
