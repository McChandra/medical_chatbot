name: Research evaluation validity
on:
  pull_request:
    paths: ['research/**', 'features/data_splitting.py', 'backend/copilot_engine.py', 'tests/test_copilot.py', '.github/workflows/research-evaluation.yml']
  push:
    branches: [main]
    paths: ['research/**', 'features/data_splitting.py', 'backend/copilot_engine.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  methodology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m unittest discover -s research/tests -v
      - run: python -m unittest discover -s tests -p test_copilot.py -v
      - run: python -m compileall -q research features backend
