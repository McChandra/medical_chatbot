name: HealthBrowse response QA
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum persona cases (4 = search and Buddy in both modes; 16 = full matrix)'
        required: true
        default: '4'
        type: choice
        options: ['4', '8', '16']
permissions:
  contents: read
concurrency:
  group: healthbrowse-response-qa
  cancel-in-progress: false
jobs:
  response-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: healthbrowse
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: healthbrowse/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Exercise General and Clinician responses using public example questions
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QA_CASE_LIMIT: ${{ inputs.limit }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo 'Set the GROQ_API_KEY Actions secret before running live response QA.'
            exit 1
          fi
          npm run qa:bot -- --limit="$QA_CASE_LIMIT" --spacing-ms=45000
      - name: Save response audit and suggested improvements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: healthbrowse-response-qa
          path: healthbrowse/qa-results/
          if-no-files-found: ignore
          retention-days: 14
