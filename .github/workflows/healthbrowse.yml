name: HealthBrowse CI and Cloud Run release

on:
  pull_request:
    paths: ['healthbrowse/**', '.github/workflows/healthbrowse.yml']
  push:
    branches: [main]
    paths: ['healthbrowse/**', '.github/workflows/healthbrowse.yml']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Release the tested commit to the configured Cloud Run service'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: healthbrowse
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: healthbrowse/package-lock.json
      - run: npm ci
      - run: npm run build && npm test
      - name: Check adapter artifacts, private API, evaluation and notebook without a GPU
        run: |
          python3 -m pip install fastapi==0.119.0 httpx==0.28.1
          python3 -m unittest discover -s inference -p 'test_*.py' -v
      - run: npm audit --audit-level=high
      - name: Validate deployment descriptors
        run: |
          docker compose config --quiet
          kubectl kustomize deploy/kubernetes > /dev/null
      - name: Build and smoke-test the actual image with restricted runtime permissions
        run: |
          docker build --pull --tag "healthbrowse:${GITHUB_SHA}" .
          docker run --detach --name healthbrowse-ci --init --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges --memory 512m \
            -p 127.0.0.1:18080:8080 "healthbrowse:${GITHUB_SHA}"
          trap 'docker logs healthbrowse-ci >&2; docker rm -f healthbrowse-ci >/dev/null' EXIT
          deploy/smoke.sh http://127.0.0.1:18080
      - name: Block fixable high/critical image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: healthbrowse:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'
          format: table
      - name: Save the scanned image for the release job
        if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && vars.HEALTHBROWSE_AUTO_DEPLOY == 'true'))
        run: docker save "healthbrowse:${GITHUB_SHA}" | gzip -1 > "${RUNNER_TEMP}/healthbrowse.tar.gz"
      - name: Retain the verified image
        if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && vars.HEALTHBROWSE_AUTO_DEPLOY == 'true'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: healthbrowse-${{ github.sha }}
          path: ${{ runner.temp }}/healthbrowse.tar.gz
          retention-days: 1
  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && vars.HEALTHBROWSE_AUTO_DEPLOY == 'true'))
    environment: healthbrowse-production
    concurrency:
      group: healthbrowse-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUD_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      RUN_SERVICE: ${{ vars.GCP_RUN_SERVICE }}
      RUNTIME_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      SECRET_BINDINGS: ${{ vars.GCP_RUN_SECRET_BINDINGS }}
      PUBLIC_SERVICE: ${{ vars.HEALTHBROWSE_PUBLIC }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: healthbrowse-${{ github.sha }}
          path: ${{ runner.temp }}/verified-image
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Publish verified image and deploy by registry digest
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUD_PROJECT:?}" "${CLOUD_REGION:?}" "${ARTIFACT_REPOSITORY:?}" "${RUN_SERVICE:?}" "${RUNTIME_ACCOUNT:?}"
          registry="${CLOUD_REGION}-docker.pkg.dev"
          repo="${registry}/${CLOUD_PROJECT}/${ARTIFACT_REPOSITORY}/healthbrowse"
          gcloud auth configure-docker "${registry}" --quiet
          docker load -i "${RUNNER_TEMP}/verified-image/healthbrowse.tar.gz"
          docker tag "healthbrowse:${GITHUB_SHA}" "${repo}:${GITHUB_SHA}"
          docker push "${repo}:${GITHUB_SHA}"
          digest=$(gcloud artifacts docker images describe "${repo}:${GITHUB_SHA}" \
            --project "${CLOUD_PROJECT}" --format='value(image_summary.digest)')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          args=(--project "$CLOUD_PROJECT" --region "$CLOUD_REGION" --image "${repo}@${digest}" \
            --service-account "$RUNTIME_ACCOUNT" --port 8080 --min 0 --max 2 \
            --memory 512Mi --cpu 1 --concurrency 20 --timeout 90 --cpu-throttling --quiet)
          [[ -z "$SECRET_BINDINGS" ]] || args+=(--update-secrets "$SECRET_BINDINGS")
          if [[ "$PUBLIC_SERVICE" == true ]]; then
            args+=(--no-invoker-iam-check)
          else
            args+=(--invoker-iam-check)
          fi
          gcloud run deploy "$RUN_SERVICE" "${args[@]}"
          url=$(gcloud run services describe "$RUN_SERVICE" --project "$CLOUD_PROJECT" \
            --region "$CLOUD_REGION" --format='value(status.url)')
          if [[ "$PUBLIC_SERVICE" == true ]]; then healthbrowse/deploy/smoke.sh "$url"; fi
          printf 'Released `%s@%s` to %s\n' "$repo" "$digest" "$url" >> "$GITHUB_STEP_SUMMARY"
